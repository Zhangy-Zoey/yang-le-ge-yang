<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>花鸟织绣 · 淡彩三叠</title>
    <style>
      @font-face {
        font-family: "SJshoujin";
        src: url("assets/fonts/shoujinti.woff2") format("woff2");
        font-weight: 400 600;
        font-style: normal;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #e8eeea;
        overflow: hidden;
        font-family: "SJshoujin", "宋徽宗瘦金体", "Songti SC", "STSong", serif;
        -webkit-tap-highlight-color: transparent;
        color: #3a403c;
      }
      #wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 80% 50% at 70% 0%, rgba(127, 158, 150, 0.18), transparent 55%),
          linear-gradient(180deg, #f3f5f2 0%, #e4eae5 100%);
      }
      #game {
        display: block;
        touch-action: none;
        max-width: 430px;
        border-radius: 20px;
        box-shadow:
          0 0 0 1px rgba(127, 158, 150, 0.28),
          0 12px 40px rgba(58, 64, 60, 0.1);
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game"></canvas>
    </div>
    <script src="js/flowers.js"></script>
    <script src="js/config.js"></script>
    <script src="js/adapter.js"></script>
    <script src="js/level.js"></script>
    <script src="js/slot.js"></script>
    <script src="js/game.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
    <script>
      try {
        bootYangGame();
      } catch (err) {
        console.error(err);
        document.body.innerHTML =
          '<pre style="padding:16px;font:13px/1.5 monospace;color:#9E4A42;white-space:pre-wrap;">' +
          '启动失败：' + err.message + '\n\n请用本地服务器打开（不要双击 html）：\n' +
          'cd yang-le-ge-yang && python3 -m http.server 8765\n' +
          '然后访问 http://localhost:8765</pre>';
      }
    </script>
  </body>
</html>
