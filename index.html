<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>花鸟织绣 · 淡彩三叠</title>
    <style>
      @font-face {
        font-family: "GameQigong";
        src: url("assets/fonts/qigongti.ttf") format("truetype");
        font-weight: 400 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "GameShoujin";
        src: url("assets/fonts/shoujinti.ttf") format("truetype");
        font-weight: 400 600;
        font-style: normal;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #f3f5f2;
        overflow: hidden;
        font-family: "GameQigong", "STKaiti", "Kaiti SC", "Songti SC", serif;
        -webkit-tap-highlight-color: transparent;
        color: #4a5048;
      }
      #wrap {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 75% 45% at 15% 5%, rgba(212, 168, 168, 0.12), transparent 55%),
          radial-gradient(ellipse 70% 50% at 85% 80%, rgba(143, 174, 158, 0.1), transparent 50%),
          linear-gradient(180deg, #faf7f2 0%, #f0ebe3 100%);
      }
      #game {
        display: block;
        touch-action: none;
        width: 100%;
        max-width: 430px;
        height: 100%;
        border-radius: 0;
        box-shadow: none;
      }
      @media (min-width: 440px) {
        #game {
          border-radius: 16px;
          box-shadow: 0 8px 32px rgba(74, 80, 72, 0.08);
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game"></canvas>
    </div>
    <script src="js/flowers.js"></script>
    <script src="js/font.js"></script>
    <script src="js/config.js"></script>
    <script src="js/adapter.js"></script>
    <script src="js/level.js"></script>
    <script src="js/slot.js"></script>
    <script src="js/game.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>
    <script>
      try {
        bootYangGame();
      } catch (err) {
        console.error(err);
        document.body.innerHTML =
          '<pre style="padding:16px;font:13px/1.5 monospace;color:#9E4A42;white-space:pre-wrap;">' +
          '启动失败：' + err.message + '\n\n请用本地服务器打开（不要双击 html）：\n' +
          'cd yang-le-ge-yang && python3 -m http.server 8765\n' +
          '然后访问 http://localhost:8765</pre>';
      }
    </script>
  </body>
</html>
